<script>
(() => {
  const params=new URLSearchParams(location.search);
  const q=params.get("lang");
  let stored=null,mode="system";
  try{stored=localStorage.getItem("cga-site-language");mode=localStorage.getItem("cga-appearance")||"system";}catch{}
  document.documentElement.lang=q==="es"?"es":q==="en"?"en":stored==="es"?"es":"en";
  const dark=mode==="dark"||(mode!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme=dark?"dark":"light";
  document.documentElement.style.colorScheme=dark?"dark":"light";
})();
</script>

.languageCopy{flex:1;min-width:0}
.languageCard .name{font-size:22px;font-weight:700;line-height:1.2}
.languageCard .description{display:block;color:var(--cga-muted,#666);font-size:12px;margin-top:7px;line-height:1.4}
.languageCard .right{display:flex;flex-direction:column;align-items:flex-end;gap:9px}
.languageCard .arrow{font-size:22px;line-height:1}
.languageCard .recommended{color:var(--cga-muted,#666);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.accent{height:3px;width:min(100%,420px);border-radius:2px;background:linear-gradient(90deg,var(--brand-pink),var(--brand-yellow));margin:0 0 31px}
.note{font-size:12px;color:var(--cga-muted,#666);margin-top:21px;line-height:1.6}
footer{width:min(1050px,calc(100% - 44px));margin:0 auto;border-top:1px solid var(--cga-border,#eee);padding:20px 0 28px;color:var(--cga-muted,#666);font-size:12px;line-height:1.5}
footer a{color:inherit}
@media(max-width:900px){
 main{width:min(360px,calc(100% - 56px));margin:0 auto;flex:1 0 auto;display:flex;flex-direction:column;justify-content:center;padding:clamp(28px,5svh,60px) 0 clamp(44px,15svh,170px)}
 .kicker{font-size:10px;line-height:1.5;letter-spacing:.12em;margin-bottom:16px}
 h1{font-size:clamp(22px,7vw,30px);line-height:1.16;letter-spacing:-.04em;margin-bottom:20px;display:grid;gap:9px}
 .languageGrid{grid-template-columns:minmax(0,1fr);width:100%;margin:0;gap:12px}
 .languageCard{width:100%;min-height:100px;padding:18px;gap:14px;border-radius:16px}
 .languageCard .name{font-size:23px;letter-spacing:-.025em}
 .languageCard .description{font-size:12px;line-height:1.4;margin-top:5px}
 .languageCard .flag{width:36px}
 .languageCard .arrow{font-size:19px}
 .accent{width:100%;max-width:none;margin-bottom:24px}
 header{padding:15px 22px}
}
@media(max-width:360px){
 main{width:calc(100% - 48px)}

 .languageCard .name{font-size:21px}
}
@media(max-width:900px) and (max-height:560px){
 main{padding:26px 0 32px}
}
@media(prefers-reduced-motion:reduce){.languageCard{transition:none}.languageCard:hover{transform:none}}
