<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Professional Portfolio | Christian Gabriel Arleo</title>
  <link rel="canonical" href="https://christianarleo.com/portafolio/?lang=en">
  <script>
    (() => {
      const params=new URLSearchParams(location.search);
      const requested=params.get("lang");
      if(requested!=="es"&&requested!=="en")params.set("lang","en");
      if(!params.has("vista"))params.set("vista","revista");
      location.replace("/portafolio/?"+params.toString()+location.hash);
    })();
  </script>
</head>
<body><p><a href="/portafolio/?lang=en&amp;vista=revista">Open the English portfolio</a></p></body>
</html>
